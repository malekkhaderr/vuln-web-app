version: 0.2

env:
  variables:
    GITLEAKS_VERSION: "8.30.1"

phases:
  install:
    commands:
      - echo "Installing Gitleaks v${GITLEAKS_VERSION}..."
      - curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
      - tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
      - chmod +x /usr/local/bin/gitleaks
      - rm gitleaks.tar.gz

  pre_build:
    commands:
      - echo "Checking Gitleaks version..."
      - gitleaks version
      # CodeBuild clones with depth=1 by default. Unshallow to inspect full commit history
      - echo "Ensuring full git history is available..."
      - git fetch --unshallow 2>/dev/null || true

  build:
    commands:
      - echo "Scanning repository for secrets..."
      # If leaks are found, gitleaks exits with code 1, which fails the CodeBuild build
      - gitleaks detect --verbose --redact --config .gitleaks.toml --report-path gitleaks-report.json

  post_build:
    commands:
      - echo "Secret scanning phase finished."

artifacts:
  files:
    - gitleaks-report.json

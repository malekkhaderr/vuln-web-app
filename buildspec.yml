version: 0.2

env:
  variables:
    NODE_ENV: "production"
    SCAN_SEVERITY_THRESHOLD: "HIGH,CRITICAL"

phases:
  install:
    runtime-versions:
      nodejs: 22
      python: 3.11
    commands:
      - echo "Installing Dependencies and Security Scanners"
      - npm install -g aws-cdk
      - python3 -m pip install --upgrade pip
      - pip3 install --no-cache-dir checkov
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - trivy --version
      - cdk --version
      - checkov --version
      - docker --version

  pre_build:
    commands:
      - echo "Pre-Build - Dependency Installation and Static Security Gates"
      - echo "Installing root and CDK dependencies..."
      - npm ci
      - cd cdk && npm ci && cd ..
      - echo "Running Trivy filesystem and dependency audit..."
      - trivy fs --security-checks vuln,secret --severity $SCAN_SEVERITY_THRESHOLD --exit-code 0 --ignore-unfixed .

  build:
    commands:
      - echo "Build - Application Quality, CDK Synthesis, IaC Security Scan"
      - echo "Running linter..."
      - npm run lint
      - export CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
      - export CDK_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-1}
      - echo "Deploying to account $CDK_DEFAULT_ACCOUNT in region $CDK_DEFAULT_REGION"
      - export WEB_ACL_ARN=$(aws ssm get-parameter --name /vuln-web-app/waf-acl-arn --query Parameter.Value --output text --region us-east-1 2>/dev/null || echo "")
      - if [ -z "$WEB_ACL_ARN" ]; then echo "WAF ACL ARN not found in SSM, using placeholder"; export WEB_ACL_ARN="arn:aws:wafv2:us-east-1:${CDK_DEFAULT_ACCOUNT}:global/webacl/ci-placeholder/ci-placeholder"; fi
      - echo "Synthesizing CloudFormation templates with cdk-nag enforcement..."
      - cd cdk && npx cdk synth --app "npx tsx bin/target-app.ts" -o cdk.out && cd ..
      - echo "Running Checkov against synthesized CloudFormation templates..."
      - checkov -d cdk/cdk.out --config-file .checkov.yml --framework cloudformation --compact

  post_build:
    commands:
      - echo "Post-Build - Deployment and DAST"
      - echo "Deploying TargetAppStack..."
      - cd cdk && npx cdk deploy TargetAppStack --app "npx tsx bin/target-app.ts" --require-approval never --outputs-file ../outputs.json && cd ..
      - export TARGET_URL=$(python3 -c "import json; print(json.load(open('outputs.json'))['TargetAppStack']['CloudFrontUrl'])")
      - echo "DAST Target URL - $TARGET_URL"
      - mkdir -p reports
      - echo "Running OWASP ZAP baseline scan..."
      - docker run --rm -v $(pwd)/reports:/zap/wrk/:rw zaproxy/zap-stable zap-baseline.py -t $TARGET_URL -r zap-report.html -J zap-report.json -l WARN || true
      - if [ -f reports/zap-report.json ]; then HIGH_ALERTS=$(python3 -c "import json; data=json.load(open('reports/zap-report.json')); alerts=data.get('site',[{}])[0].get('alerts',[]) if isinstance(data.get('site'),list) else []; print(len([a for a in alerts if a.get('riskcode','0') in ('3','4')]))" 2>/dev/null || echo "0"); echo "High/Critical DAST alerts found - $HIGH_ALERTS"; if [ "$HIGH_ALERTS" -gt 0 ]; then echo "DAST gate FAILED"; exit 1; fi; else echo "ZAP report not found, skipping DAST evaluation"; fi

artifacts:
  files:
    - "outputs.json"
    - "reports/**/*"
    - "cdk/cdk.out/**/*"
  discard-paths: no

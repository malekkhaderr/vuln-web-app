version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.10
    commands:
      - echo "[*] Installing pinned Semgrep version (1.68.0)..."
      - pip install semgrep==1.68.0

  pre_build:
    commands:
      - echo "[*] Verifying Semgrep installation..."
      - semgrep --version

  build:
    commands:
      - echo "[*] Running SAST code analysis with Semgrep (Report-Only Mode)..."
      - mkdir -p reports
      # Capture semgrep scan status without exiting on findings
      - set +e
      - semgrep scan --config p/javascript --json -o reports/semgrep.json .
      - STATUS=$?
      - set -e
      - echo "[*] Semgrep scan completed with raw exit status $STATUS"
      # Generate human-readable summary if script is present
      - node scripts/format-semgrep-report.js || true

  post_build:
    commands:
      - echo "[*] Semgrep SAST phase completed at $(date)."
      - node scripts/generate-summary.js || true

artifacts:
  files:
    - reports/semgrep.json
    - reports/**/*

version: 0.2

phases:
  install:
    commands:
      - echo "Installing Trivy..."
      - TRIVY_VERSION="0.74.0"
      - curl -sSL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      - tar -xzf trivy.tar.gz -C /usr/local/bin trivy
      - chmod +x /usr/local/bin/trivy
      - trivy --version
  build:
    commands:
      - echo "Running Trivy Scan (reflecting pr-checks)..."
      - |
        trivy fs . \
          --scanners vuln,secret \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --format json \
          --output trivy-report.json || true
      - |
        if [ -s trivy-report.json ] && jq -e '.Results[] | select(.Vulnerabilities != null or .Secrets != null)' trivy-report.json > /dev/null 2>&1; then
          echo "Vulnerabilities or Secrets detected by Trivy!"
          exit 1
        fi

artifacts:
  files:
    - trivy-report.json

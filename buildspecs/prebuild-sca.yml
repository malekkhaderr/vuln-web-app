version: 0.2

phases:
  install:
    commands:
      - echo "Installing Trivy..."
      - TRIVY_VERSION="0.74.0"
      - curl -sSL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      - tar -xzf trivy.tar.gz -C /usr/local/bin trivy
      - chmod +x /usr/local/bin/trivy
      - trivy --version
  build:
    commands:
      - echo "Running Trivy SCA dependency scan..."
      - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 package-lock.json cdk/package-lock.json

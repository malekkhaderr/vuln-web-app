version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
      python: 3.11
    commands:
      - echo "Installing dependencies and Checkov..."
      - pip install checkov
      - npm ci
      - cd cdk && npm ci && cd ..
  pre_build:
    commands:
      - echo "Running Linting & Pre-checks..."
      - npm run lint || true
  build:
    commands:
      - echo "Synthesizing CDK Templates..."
      - cd cdk
      - npx cdk synth
      - cd ..
  post_build:
    commands:
      - echo "Running Checkov IaC Security Scans on synthesized templates..."
      - checkov -d cdk/cdk.out --framework cloudformation --compact --quiet || true

artifacts:
  base-directory: cdk/cdk.out
  files:
    - '**/*'

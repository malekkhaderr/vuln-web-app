version: 0.2

env:
  variables:
    GITLEAKS_VERSION: "8.30.1"

phases:
  install:
    commands:
      - echo "[*] Installing Gitleaks v${GITLEAKS_VERSION}..."
      - curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
      - tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
      - chmod +x /usr/local/bin/gitleaks
      - rm gitleaks.tar.gz

  pre_build:
    commands:
      - echo "[*] Verifying Gitleaks installation..."
      - gitleaks version

  build:
    commands:
      - echo "[*] Starting secret scanning (Report-Only Mode)..."
      - mkdir -p reports
      # Use set +e to capture scanner exit code without failing CodeBuild
      - set +e
      - gitleaks detect --source=. --no-git --verbose --redact --config .gitleaks.toml -f json -r reports/gitleaks.json
      - STATUS=$?
      - set -e
      - echo "[*] Gitleaks scan completed with raw exit status $STATUS"
      # Generate human-readable Markdown summary if formatting script is present
      - node scripts/format-secrets-report.js || true

  post_build:
    commands:
      - echo "[*] Secret scanning phase completed successfully at $(date)."
      - node scripts/generate-summary.js || true

artifacts:
  files:
    - reports/**/*
version: 0.2

phases:
  install:
    commands:
      - echo "Installing Gitleaks..."
      - GITLEAKS_VERSION="8.24.0"
      - curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
      - tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
      - chmod +x /usr/local/bin/gitleaks
      - gitleaks version
  build:
    commands:
      - echo "Running Gitleaks Scan..."
      - gitleaks detect --config .gitleaks.toml --verbose --report-format json --report-path gitleaks-report.json || true
      - |
        if [ -s gitleaks-report.json ] && [ "$(cat gitleaks-report.json)" != "[]" ]; then
          echo "Secrets detected by Gitleaks!"
          exit 1
        fi

artifacts:
  files:
    - gitleaks-report.json

version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "[*] Checking Node.js and npm versions..."
      - node -v
      - npm -v

  pre_build:
    commands:
      - echo "[*] Verifying package-lock.json presence..."
      - test -f package-lock.json || (echo "ERROR: package-lock.json missing!" && exit 1)

  build:
    commands:
      - echo "[*] Running dependency vulnerability scan (Report-Only Mode)..."
      - mkdir -p reports
      # Use set +e so non-zero exit codes from npm audit (found vulnerabilities) don't fail the build
      - set +e
      - npm audit --json > reports/dependency-audit.json
      - STATUS=$?
      - set -e
      - echo "[*] npm audit completed with raw exit status $STATUS"
      # Generate human-readable summary if script is present
      - node scripts/format-deps-report.js || true

  post_build:
    commands:
      - echo "[*] Dependency vulnerability scanning completed at $(date)."
      - node scripts/generate-summary.js || true

artifacts:
  files:
    - reports/dependency-audit.json
    - reports/**/*

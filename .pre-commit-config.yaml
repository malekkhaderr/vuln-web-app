repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml

  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks secret scan
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false

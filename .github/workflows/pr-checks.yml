name: Security Checks

on:
  push:
  pull_request:
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          tar -zxvf gitleaks_8.24.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Scan
        run: |
          gitleaks detect --config .gitleaks.toml --verbose --report-format json --report-path gitleaks-report.json
        continue-on-error: true
      - name: Upload Gitleaks Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
      - name: Convert JSON to SARIF for Security Tab
        if: always()
        run: |
          gitleaks detect --config .gitleaks.toml --report-format sarif --report-path gitleaks-report.sarif
        continue-on-error: true

      # Step 2: Upload SARIF to GitHub Code Scanning
      - name: Upload SARIF to Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-report.sarif
          category: 'gitleaks-secret-scan'

      - name: Enforce Secret Check Status
        run: |
          if [ -s gitleaks-report.json ] && [ "$(cat gitleaks-report.json)" != "[]" ]; then
            echo "Secrets detected by Gitleaks!"
            exit 1
          fi

  codeql-analysis:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          output: '${{ github.workspace }}/results'

      - name: Upload CodeQL SARIF Artifact
        uses: actions/upload-artifact@v4
        if: always() # Ensures artifact uploads even when CodeQL detects vulnerabilities
        with:
          name: codeql-results-${{ matrix.language }}
          path: results/*.sarif

  security-checks-summary:
    name: Post Combined Security PR Comment
    runs-on: ubuntu-latest
    needs: [secret-scan, codeql-analysis]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download Gitleaks Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: .
        continue-on-error: true

      # Downloads all codeql-results-* artifacts into a 'sarif-reports' directory
      - name: Download CodeQL SARIF Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: codeql-results-*
          path: sarif-reports
          merge-multiple: true
        continue-on-error: true

      - name: Format Combined Report as Markdown
        uses: actions/github-script@v7
        id: format-comment
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let markdown = `## 🛡️ Combined Security Scan Results\n\n`;

            // ==========================================
            // 1. Process Gitleaks Report
            // ==========================================
            markdown += `### 🔑 Secret Scanning (Gitleaks)\n`;
            if (fs.existsSync('gitleaks-report.json')) {
              try {
                const gitleaks = JSON.parse(fs.readFileSync('gitleaks-report.json', 'utf8'));
                if (Array.isArray(gitleaks) && gitleaks.length > 0) {
                  markdown += `🚨 **${gitleaks.length} leak(s) detected!**\n\n`;
                  markdown += '| Rule ID | File | Line | Snippet |\n| :--- | :--- | :--- | :--- |\n';
                  gitleaks.forEach(leak => {
                    const rule = leak.RuleID || 'Unknown Rule';
                    const file = leak.File || 'N/A';
                    const line = leak.StartLine || 'N/A';
                    const secret = leak.Secret ? `\`${leak.Secret.substring(0, 8)}...\`` : '`******`';
                    markdown += `| **${rule}** | \`${file}\` | \`${line}\` | ${secret} |\n`;
                  });
                } else {
                  markdown += `✅ **No leaked secrets or credentials detected.**\n`;
                }
              } catch (err) {
                markdown += `⚠️ Failed to parse Gitleaks JSON report.\n`;
              }
            } else {
              markdown += `⚠️ Gitleaks report file not found.\n`;
            }

            markdown += `\n---\n\n`;

            // ==========================================
            // 2. Process CodeQL SARIF Reports
            // ==========================================
            markdown += `### 🔍 CodeQL Static Analysis (SAST)\n`;

            const sarifDir = 'sarif-reports';
            let codeqlAlerts = [];

            if (fs.existsSync(sarifDir)) {
              const sarifFiles = fs.readdirSync(sarifDir).filter(f => f.endsWith('.sarif'));

              sarifFiles.forEach(file => {
                try {
                  const sarifContent = JSON.parse(fs.readFileSync(path.join(sarifDir, file), 'utf8'));
                  const runs = sarifContent.runs || [];

                  runs.forEach(run => {
                    const results = run.results || [];
                    const rules = (run.tool && run.tool.driver && run.tool.driver.rules) ? run.tool.driver.rules : [];

                    results.forEach(res => {
                      const ruleId = res.ruleId || 'Unknown Rule';
                      const message = (res.message && res.message.text) ? res.message.text.split('\n')[0] : 'Security Finding';

                      // 1. Locate the rule definition metadata
                      const ruleMatch = rules.find(r => r.id === ruleId);
                      const props = (ruleMatch && ruleMatch.properties) ? ruleMatch.properties : {};

                      // 2. Extract CVSS / Security Severity score (0.0 - 10.0) or fallback severity
                      const secScore = props['security-severity'] ? parseFloat(props['security-severity']) : null;
                      const rawSeverity = props['problem.severity'] || res.level || 'warning';

                      // 3. Map to accurate human-readable badges
                      let badge = '🟡 **MEDIUM**';

                      if (secScore !== null) {
                        if (secScore >= 9.0) {
                          badge = '🔴 **CRITICAL**';
                        } else if (secScore >= 7.0) {
                          badge = '🔴 **HIGH**';
                        } else if (secScore >= 4.0) {
                          badge = '🟡 **MEDIUM**';
                        } else {
                          badge = '⚪ **LOW**';
                        }
                      } else {
                        const sevLower = rawSeverity.toLowerCase();
                        if (sevLower === 'error') {
                          badge = '🔴 **HIGH**';
                        } else if (sevLower === 'warning') {
                          badge = '🟡 **MEDIUM**';
                        } else if (sevLower === 'recommendation' || sevLower === 'note') {
                          badge = '⚪ **LOW**';
                        }
                      }

                      // 4. Extract location details
                      let locFile = 'N/A';
                      let locLine = 'N/A';
                      if (res.locations && res.locations[0] && res.locations[0].physicalLocation) {
                        const phys = res.locations[0].physicalLocation;
                        if (phys.artifactLocation && phys.artifactLocation.uri) {
                          locFile = phys.artifactLocation.uri;
                        }
                        if (phys.region && phys.region.startLine) {
                          locLine = phys.region.startLine;
                        }
                      }

                      codeqlAlerts.push({
                        ruleId,
                        message,
                        badge,
                        file: locFile,
                        line: locLine
                      });
                    });
                  });
                } catch (err) {
                  core.warning(`Failed to parse SARIF file ${file}: ${err.message}`);
                }
              });
            }

            if (codeqlAlerts.length > 0) {
              markdown += `🚨 **${codeqlAlerts.length} vulnerability(ies) detected!**\n\n`;
              markdown += '| Severity | Rule / Vulnerability | File | Line |\n| :--- | :--- | :--- | :--- |\n';

              codeqlAlerts.forEach(alert => {
                markdown += `| ${alert.badge} | **${alert.ruleId}**<br>_${alert.message}_ | \`${alert.file}\` | \`${alert.line}\` |\n`;
              });

              markdown += `\n> Check the **Files Changed** tab or the repository **Security** tab for complete taint-trace details.`;
            } else {
              markdown += `✅ **CodeQL Analysis Passed!** No security vulnerabilities detected.\n`;
            }

            markdown += `\n---\n\n`;

            // ==========================================
            // 3. Process Trivy Report
            // ==========================================
            markdown += `### 📦 Dependency & Vulnerability Scan (Trivy)\n`;

            if (fs.existsSync('trivy-report.json')) {
              try {
                const trivyData = JSON.parse(fs.readFileSync('trivy-report.json', 'utf8'));
                const results = trivyData.Results || [];
                let trivyAlerts = [];

                results.forEach(res => {
                  const target = res.Target || 'Unknown Target';

                  // Parse Vulnerabilities
                  if (Array.isArray(res.Vulnerabilities) && res.Vulnerabilities.length > 0) {
                    res.Vulnerabilities.forEach(vuln => {
                      const sev = vuln.Severity ? vuln.Severity.toUpperCase() : 'UNKNOWN';
                      let badge = '🟡 **MEDIUM**';
                      if (sev === 'CRITICAL' || sev === 'HIGH') badge = `🔴 **${sev}**`;
                      else if (sev === 'LOW') badge = '⚪ **LOW**';

                      trivyAlerts.push({
                        type: 'Vulnerability',
                        severity: badge,
                        id: vuln.VulnerabilityID || 'N/A',
                        pkg: vuln.PkgName || 'N/A',
                        installedVersion: vuln.InstalledVersion || 'N/A',
                        fixedVersion: vuln.FixedVersion || 'None',
                        target
                      });
                    });
                  }

                  // Parse Secrets (if detected by Trivy)
                  if (Array.isArray(res.Secrets) && res.Secrets.length > 0) {
                    res.Secrets.forEach(sec => {
                      const sev = sec.Severity ? sec.Severity.toUpperCase() : 'UNKNOWN';
                      let badge = '🔴 **HIGH**';
                      if (sev === 'CRITICAL') badge = '🔴 **CRITICAL**';

                      trivyAlerts.push({
                        type: 'Secret',
                        severity: badge,
                        id: sec.RuleID || 'Secret Detected',
                        pkg: sec.Title || 'N/A',
                        installedVersion: `Line ${sec.StartLine || 'N/A'}`,
                        fixedVersion: 'N/A',
                        target
                      });
                    });
                  }
                });

                if (trivyAlerts.length > 0) {
                  markdown += `🚨 **${trivyAlerts.length} dependency finding(s) detected!**\n\n`;
                  markdown += '| Severity | Type | ID / Rule | Package / File | Fixed Version |\n| :--- | :--- | :--- | :--- | :--- |\n';

                  trivyAlerts.forEach(item => {
                    markdown += `| ${item.severity} | ${item.type} | **${item.id}** | \`${item.pkg}\` (\`${item.target}\`) | \`${item.fixedVersion}\` |\n`;
                  });
                } else {
                  markdown += `✅ **No high/critical vulnerabilities or secrets found in dependencies.**\n`;
                }
              } catch (err) {
                markdown += `⚠️ Failed to parse Trivy JSON report.\n`;
              }
            } else {
              markdown += `⚠️ Trivy report file not found.\n`;
            }

            markdown += `\n\n> *Report generated automatically by GitHub Actions.*`;
            core.setOutput('comment', markdown);
      - name: Post PR Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.format-comment.outputs.comment }}
  dependency-scan:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy CLI
        run: |
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Run Trivy Scan (JSON Report)
        run: |
          trivy fs . \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-report.json
        continue-on-error: true

      - name: Run Trivy Scan (SARIF Report for Security Tab)
        if: always()
        run: |
          trivy fs . \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-report.sarif
        continue-on-error: true

      - name: Upload Trivy Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 7

      - name: Upload Trivy SARIF to Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-report.sarif
          category: trivy-dependency-scan

      - name: Enforce Dependency Check Status
        run: |
          if [ -s trivy-report.json ] && jq -e '.Results[] | select(.Vulnerabilities != null or .Secrets != null)' trivy-report.json > /dev/null 2>&1; then
            echo "Vulnerabilities or Secrets detected by Trivy!"
            exit 1
          fi

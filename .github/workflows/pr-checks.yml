name: Security Checks

on:
  push: # consider limiting to `branches: [main]` to avoid duplicate runs on PR branches
  pull_request:
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Secret scan (Gitleaks)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # required for repos owned by a GitHub organization
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_COMMENTS: false # PR comments need pull-requests: write

  # ---------------------------------------------------------------------------
  # CodeQL
  # ---------------------------------------------------------------------------
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          output: sarif-results
          upload: always

      - name: Summarize CodeQL results
        if: always()
        run: |
          f=$(ls sarif-results/*.sarif 2>/dev/null | head -1)
          {
            echo "## CodeQL (${{ matrix.language }})"
            if [ -z "$f" ]; then
              echo "No SARIF file was produced."
            else
              total=$(jq '[.runs[].results[]?] \vert{} length' "$f")
              echo "Findings: **$total**"
              if [ "$total" -gt 0 ]; then
                echo
                echo "| Rule | Level | Location |"
                echo "|---|---|---|"
                jq -r '[.runs[].results[]?][:50][]
                  | "| \(.ruleId) | \(.level // "warning") | \(.locations[0].physicalLocation.artifactLocation.uri // "-"):\(.locations[0].physicalLocation.region.startLine // "-") |"' "$f"
                if [ "$total" -gt 50 ]; then
                  echo
                  echo "_Showing first 50 of $total findings. See the artifact or Security tab for all._"
                fi
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CodeQL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-codeql-${{ matrix.language }}
          path: sarif-results

  # ---------------------------------------------------------------------------
  # Dependency / filesystem scan (Trivy)
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          exit-code: 1

      - name: Publish Trivy report
        if: always()
        run: |
          {
            echo "## Trivy"
            echo "Result: **${{ steps.trivy.outcome }}**"
            echo
            echo '```'
            if [ -s trivy-report.txt ]; then
              head -c 500000 trivy-report.txt
            else
              echo "No HIGH/CRITICAL findings (or no report generated)."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-trivy
          path: trivy-report.txt

      - name: Enforce Trivy result
        if: steps.trivy.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  # CDK synth + Checkov
  # ---------------------------------------------------------------------------
  cdk-synth:
    name: CDK Synthesis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk

      - name: Synthesize CDK
        id: synth
        continue-on-error: true
        working-directory: cdk
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: eu-west-1
          WEB_ACL_ARN: arn:aws:wafv2:us-east-1:000000000000:global/webacl/ci-placeholder/ci-placeholder
        run: npx cdk synth --app "npx tsx bin/target-app.ts"

      - name: Install Checkov
        if: steps.synth.outcome == 'success'
        run: python -m pip install checkov

      - name: Scan synthesized CloudFormation
        id: checkov
        if: steps.synth.outcome == 'success'
        continue-on-error: true
        run: |
          checkov -d cdk/cdk.out --framework cloudformation \
            --output cli --output github_failed_only \
            --output-file-path console,checkov-report

      - name: Publish CDK / Checkov report
        if: always()
        run: |
          {
            echo "## CDK Synthesis and Checkov"
            echo "- CDK synth: **${{ steps.synth.outcome }}**"
            echo "- Checkov: **${{ steps.checkov.outcome }}**"
            echo
            if [ "${{ steps.synth.outcome }}" != "success" ]; then
              echo "CDK synthesis failed, so Checkov did not run. See the job log for details."
            else
              f=$(ls checkov-report/*github_failed_only* 2>/dev/null | head -1)
              if [ -n "$f" ] && [ -s "$f" ]; then
                head -c 500000 "$f"
              else
                echo "No failed checks 🎉"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-checkov
          path: checkov-report

      - name: Enforce CDK / Checkov result
        if: steps.synth.outcome == 'failure' || steps.checkov.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  # Lint and format
  # ---------------------------------------------------------------------------
  code-quality:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        id: format
        continue-on-error: true
        run: |
          set +e
          npm run format:check 2>&1 | tee format-report.txt
          exit "${PIPESTATUS[0]}"

      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: npm run lint -- -f json -o eslint-report.json

      - name: Publish lint report
        if: always()
        run: |
          {
            echo "## Lint and Format"
            echo "- Prettier: **${{ steps.format.outcome }}**"
            echo "- ESLint: **${{ steps.eslint.outcome }}**"
            if [ -s eslint-report.json ]; then
              count=$(jq '[.[].messages[]] | length' eslint-report.json)
              if [ "$count" -gt 0 ]; then
                echo
                echo "| File | Line | Rule | Message |"
                echo "|---|---|---|---|"
                jq -r --arg ws "$GITHUB_WORKSPACE/" '
                  [.[] | select(.messages | length > 0) | .filePath as $f | .messages[]
                    | "| \($f \vert{} sub($ws; "")) | \(.line // "-") | \(.ruleId // "-") | \(.message | gsub("[|\n]"; " ")) |"][:100][]
                ' eslint-report.json
                if [ "$count" -gt 100 ]; then
                  echo
                  echo "_Showing first 100 of $count findings. See the artifact for all._"
                fi
              fi
            fi
            if [ "${{ steps.format.outcome }}" = "failure" ] && [ -s format-report.txt ]; then
              echo
              echo "**Prettier output**"
              echo '```'
              head -c 100000 format-report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-lint
          path: |
            eslint-report.json
            format-report.txt

      - name: Enforce lint result
        if: steps.format.outcome == 'failure' || steps.eslint.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  # Roll-up report
  # ---------------------------------------------------------------------------
  report:
    name: Security Report
    runs-on: ubuntu-latest
    if: always()
    env:
      AWS_SNS_TOPIC_ARN: ${{ secrets.AWS_SNS_TOPIC_ARN }}
      AWS_REPORT_ROLE_ARN: ${{ secrets.AWS_REPORT_ROLE_ARN }}
      AWS_REPORT_REGION: ${{ vars.AWS_REPORT_REGION || 'eu-west-1' }}
    permissions:
      contents: read
      pull-requests: write # Ensures permission to comment on PRs
      id-token: write
    needs:
      - secret-scan
      - codeql-analysis
      - dependency-scan
      - cdk-synth
      - code-quality

    steps:
      - name: Download all reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: reports

      - name: Build report
        if: always()
        env:
          R_SECRETS: ${{ needs.secret-scan.result }}
          R_CODEQL: ${{ needs.codeql-analysis.result }}
          R_DEPS: ${{ needs.dependency-scan.result }}
          R_CDK: ${{ needs.cdk-synth.result }}
          R_QUALITY: ${{ needs.code-quality.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ passed" ;;
              failure) echo "❌ failed" ;;
              *)       echo "⚪ $1" ;;
            esac
          }
          {
            echo "# Security Checks Report"
            echo
            echo "- **Repository:** $GITHUB_REPOSITORY"
            echo "- **Ref:** \`$GITHUB_REF_NAME\` @ \`${GITHUB_SHA::7}\`"
            echo "- **Trigger:** $GITHUB_EVENT_NAME"
            echo "- **Run:** $RUN_URL"
            echo
            echo "## Overview"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Secret scan (Gitleaks) | $(icon "$R_SECRETS") |"
            echo "| CodeQL | $(icon "$R_CODEQL") |"
            echo "| Dependency scan (Trivy) | $(icon "$R_DEPS") |"
            echo "| CDK synth + Checkov | $(icon "$R_CDK") |"
            echo "| Lint and format | $(icon "$R_QUALITY") |"

            mapfile -t sarifs < <(find reports -type f -name '*.sarif' -print)
            echo
            echo "## Gitleaks results"
            echo
            echo "Result: $(icon "$R_SECRETS")"
            echo
            mapfile -t gitleaks_sarifs < <(find reports -type f \(-iname '*gitleaks*.sarif' -o -iname '*secret*.sarif'\) -print)
            if [ ${#gitleaks_sarifs[@]} -gt 0 ]; then
              for f in "${gitleaks_sarifs[@]}"; do
                echo "Findings: **$(jq '[.runs[].results[]?] \vert{} length' "$f")**"
              done
            else
              echo "Gitleaks details are available in the Gitleaks job output and artifact."
            fi

            echo
            echo "## CodeQL results"
            echo
            mapfile -t sarifs < <(find reports -path '*report-codeql-*' -type f -name '*.sarif' -print)
            if [ ${#sarifs[@]} -gt 0 ]; then
              echo "| Language | Findings |"
              echo "|---|---:|"
              for f in "${sarifs[@]}"; do
                lang=$(basename "$f" .sarif)
                echo "| $lang | $(jq '[.runs[].results[]?] \vert{} length' "$f") |"
              done
            else
              echo "No CodeQL SARIF report was produced."
            fi

            echo
            echo "## Trivy results"
            echo
            trivy=(reports/report-trivy/*)
            if [ ${#trivy[@]} -gt 0 ] && [ -s "${trivy[0]}" ]; then
              echo '```text'
              head -c 100000 "${trivy[0]}"
              echo
              echo '```'
            else
              echo "No Trivy report was produced."
            fi

            echo
            echo "## Checkov results"
            echo
            checkov=(reports/report-checkov/*)
            if [ ${#checkov[@]} -gt 0 ]; then
              for f in "${checkov[@]}"; do
                if [ -s "$f" ]; then
                  echo '```text'
                  head -c 100000 "$f"
                  echo
                  echo '```'
                fi
              done
            else
              echo "No Checkov report was produced."
            fi

            echo
            echo "## Code quality results"
            echo
            echo "Prettier: $(icon "$R_QUALITY")"
            echo "ESLint details are included in the lint artifact when findings exist."

            echo
            echo "Detailed machine-readable reports are available in the **security-report** artifact."
          } | tee security-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            security-report.md
            reports/

      - name: Post combined report to pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: security-report
          path: security-report.md

      - name: Configure AWS credentials for email
        if: env.AWS_SNS_TOPIC_ARN != '' && env.AWS_REPORT_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_REPORT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REPORT_REGION }}

      - name: Email combined report through SNS
        if: env.AWS_SNS_TOPIC_ARN != '' && env.AWS_REPORT_ROLE_ARN != ''
        run: |
          aws sns publish \
            --topic-arn "$AWS_SNS_TOPIC_ARN" \
            --subject "Security report: $GITHUB_REPOSITORY @ ${GITHUB_SHA::7}" \
            --message file://security-report.md

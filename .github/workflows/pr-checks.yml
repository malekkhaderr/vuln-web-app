name: Security Checks

'on':
  push: null
  pull_request: null
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GITLEAKS_LICENSE: '${{ secrets.GITLEAKS_LICENSE }}'
          GITLEAKS_ENABLE_SUMMARY: 'true'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_COMMENTS: "${{ github.event_name == 'pull_request' }}"

      - name: Save Gitleaks SARIF for PR comment
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif

  codeql-analysis:
    name: 'CodeQL Analysis (${{ matrix.language }})'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: '${{ matrix.language }}'
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          output: '../codeql-results-${{ matrix.language }}.sarif'

      - name: Save CodeQL SARIF for PR comment
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: '../codeql-results-${{ matrix.language }}.sarif'

  dependency-scan:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository with Trivy (SARIF Report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Save Trivy SARIF for PR comment
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy-results.sarif

  cdk-synth:
    name: CDK Synthesis + Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install CDK dependencies
        working-directory: cdk
        run: npm ci

      - name: Synthesize CDK
        working-directory: cdk
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: eu-west-1
          WEB_ACL_ARN: arn:aws:wafv2:us-east-1:000000000000:global/webacl/ci-placeholder/ci-placeholder
        run: npx cdk synth --app "npx tsx bin/target-app.ts"

      - name: Run Checkov (Generate SARIF)
        uses: bridgecrewio/checkov-action@master
        if: always()
        with:
          directory: cdk/cdk.out
          framework: cloudformation
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true

      - name: Upload Checkov SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif/results_sarif.sarif
          category: checkov

      - name: Save Checkov SARIF for PR comment
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-sarif
          path: checkov-results.sarif/results_sarif.sarif

  pr-summary-comment:
    name: Post Detailed PR Security Report
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs:
      - secret-scan
      - codeql-analysis
      - dependency-scan
      - cdk-synth
    permissions:
      pull-requests: write

    steps:
      - name: Download Gitleaks SARIF
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gitleaks-sarif
          path: sarifs/gitleaks

      - name: Download Trivy SARIF
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trivy-sarif
          path: sarifs/trivy

      - name: Download Checkov SARIF
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: checkov-sarif
          path: sarifs/checkov

      - name: Download CodeQL JS/TS SARIF
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: codeql-sarif-javascript-typescript
          path: sarifs/codeql-js

      - name: Download CodeQL Actions SARIF
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: codeql-sarif-actions
          path: sarifs/codeql-actions

      - name: Generate Detailed Markdown Report
        uses: actions/github-script@v7
        id: generate-report
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          CODEQL_RESULT: ${{ needs.codeql-analysis.result }}
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
          CDK_SYNTH_RESULT: ${{ needs.cdk-synth.result }}
        with:
          script: |
            const fs = require('fs');

            function parseSarif(filePath, toolName) {
              if (!fs.existsSync(filePath)) return [];
              try {
                const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                const findings = [];
                for (const run of data.runs || []) {
                  for (const result of run.results || []) {
                    const ruleId = result.ruleId || 'Unknown Rule';
                    const message = result.message?.text || 'No description';
                    const level = result.level || 'warning';
                    const location = result.locations?.[0]?.physicalLocation;
                    const file = location?.artifactLocation?.uri || 'N/A';
                    const line = location?.region?.startLine || '-';
                    findings.push({ toolName, ruleId, message, level, file, line });
                  }
                }
                return findings;
              } catch (e) {
                return [];
              }
            }

            const gitleaksFindings = parseSarif('sarifs/gitleaks/gitleaks.sarif', 'Gitleaks');
            const codeqlJsFindings = parseSarif('sarifs/codeql-js/codeql-results-javascript-typescript.sarif', 'CodeQL');
            const codeqlActionsFindings = parseSarif('sarifs/codeql-actions/codeql-results-actions.sarif', 'CodeQL');
            const trivyFindings = parseSarif('sarifs/trivy/trivy-results.sarif', 'Trivy');
            const checkovFindings = parseSarif('sarifs/checkov/results_sarif.sarif', 'Checkov');

            const allFindings = [
              ...gitleaksFindings,
              ...codeqlJsFindings,
              ...codeqlActionsFindings,
              ...trivyFindings,
              ...checkovFindings
            ];

            let detailedMarkdown = '';
            if (allFindings.length === 0) {
              detailedMarkdown = '\n\n### 🔍 Detailed Findings\n\n✨ **No open security findings detected!**';
            } else {
              detailedMarkdown = `\n\n<details><summary><b>🔍 Detailed Vulnerability Findings (${allFindings.length})</b></summary>\n\n` +
                '| Tool | Severity | Rule / Issue | File Path | Line |\n' +
                '| :--- | :--- | :--- | :--- | :--- |\n' +
                allFindings.map(f => {
                  const severityBadge = f.level === 'error' ? '🔴 Error' : '🟡 Warning';
                  const cleanMsg = f.message.replace(/[\r\n]+/g, ' ').substring(0, 100);
                  return `| **${f.toolName}** | ${severityBadge} | **${f.ruleId}**: ${cleanMsg} | \`${f.file}\` | \`${f.line}\` |`;
                }).join('\n') +
                '\n\n</details>';
            }

            const statusBadge = (res) => res === 'success' ? '✅ Passed' : '❌ Failed';

            const commentBody = `### 🛡️ Combined Security & Code Quality Report
            **Commit:** \`${context.sha}\`

            | Check | Tool | Status |
            | :--- | :--- | :--- |
            | **Secret Scan** | Gitleaks | ${statusBadge(process.env.SECRET_SCAN_RESULT)} |
            | **SAST Analysis** | CodeQL | ${statusBadge(process.env.CODEQL_RESULT)} |
            | **Dependencies** | Trivy | ${statusBadge(process.env.DEPENDENCY_SCAN_RESULT)} |
            | **IaC Scan** | Checkov | ${statusBadge(process.env.CDK_SYNTH_RESULT)} |
            ${detailedMarkdown}`;

            fs.writeFileSync('pr-report.md', commentBody);

      - name: Post or Update PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: security-suite-report
          path: pr-report.md

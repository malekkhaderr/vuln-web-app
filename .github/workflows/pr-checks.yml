name: Security Checks

on:
  # Triggers on ALL pushes to ANY branch to scan the entire repo state
  push:
  # Triggers on all pull requests
  pull_request:
  # Weekly fallback scheduled scan across the repo
  schedule:
    - cron: '30 1 * * 0'

# Global permissions
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (Full History for complete repo scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets across all commits and files
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'actions']

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          # Fetch full history to ensure CodeQL maps all files in git history context
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Uses the expanded security suite for maximum rule coverage
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
